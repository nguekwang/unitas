<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Unitas</title>
<style>
  :root { --bg:#1e1e1e; --bar:#252526; --tab:#2d2d2d; --active:#1e1e1e; --fg:#d4d4d4; --dim:#8a8a8a; --accent:#3b82f6; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:80px; overflow:hidden; background:var(--bar); color:var(--fg);
    font: 13px -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; user-select:none; }
  #tabs { display:flex; height:36px; align-items:flex-end; padding:4px 6px 0; gap:2px; overflow-x:auto; }
  #tabs::-webkit-scrollbar { display:none; }
  .tab { display:flex; align-items:center; gap:6px; min-width:110px; max-width:220px; height:32px; padding:0 8px;
    background:var(--tab); border-radius:8px 8px 0 0; cursor:default; flex:0 1 200px; }
  .tab.active { background:var(--active); }
  .tab .ic { font-size:12px; opacity:.8; }
  .tab .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tab .x { width:18px; height:18px; line-height:18px; text-align:center; border-radius:4px; color:var(--dim); }
  .tab .x:hover { background:#444; color:#fff; }
  #plus { width:28px; height:28px; margin-bottom:2px; border:0; background:none; color:var(--dim); font-size:18px; border-radius:6px; }
  #plus:hover, .btn:hover { background:#3a3a3a; color:#fff; }
  #bar { display:flex; align-items:center; gap:4px; height:44px; padding:0 8px; background:var(--active); border-bottom:1px solid #333; }
  .btn { height:30px; min-width:30px; padding:0 8px; border:0; border-radius:6px; background:none; color:var(--fg); font-size:14px; }
  .btn:disabled { opacity:.3; }
  #addr { flex:1; height:30px; padding:0 12px; border:1px solid #3a3a3a; border-radius:15px; background:#2b2b2b; color:var(--fg); outline:none; font-size:13px; user-select:text; }
  #addr:focus { border-color:var(--accent); }
</style>
</head>
<body>
<div id="tabs"></div>
<div id="bar">
  <button class="btn" id="back" title="戻る">←</button>
  <button class="btn" id="fwd" title="進む">→</button>
  <button class="btn" id="reload" title="再読み込み (Ctrl+R)">⟳</button>
  <input id="addr" placeholder="URL・検索語・ファイルパスを入力 (Ctrl+L)" spellcheck="false" autocomplete="off">
  <button class="btn" id="open" title="ファイルを開く (Ctrl+O)">開く</button>
  <button class="btn" id="edit" title="このファイルを編集 (Ctrl+E)">編集</button>
</div>
<script>
const $ = id => document.getElementById(id);
const ICON = { web:'🌐', pdf:'📕', html:'🧩', image:'🖼', editor:'📝', start:'✦' };
let state = { tabs: [], activeId: null };

function render() {
  const el = $('tabs');
  el.innerHTML = '';
  for (const t of state.tabs) {
    const d = document.createElement('div');
    d.className = 'tab' + (t.id === state.activeId ? ' active' : '');
    d.title = t.addr || t.title;
    d.innerHTML = '<span class="ic"></span><span class="t"></span><span class="x">×</span>';
    d.querySelector('.ic').textContent = ICON[t.kind] || '·';
    d.querySelector('.t').textContent = t.title;
    d.addEventListener('mousedown', e => {
      if (e.button === 1) { shellApi.send('close', t.id); return; }
      if (e.target.classList.contains('x')) return;
      shellApi.send('activate', t.id);
    });
    d.querySelector('.x').addEventListener('click', () => shellApi.send('close', t.id));
    el.appendChild(d);
  }
  const plus = document.createElement('button');
  plus.id = 'plus'; plus.textContent = '+'; plus.title = '新しいタブ (Ctrl+T)';
  plus.onclick = () => shellApi.send('new-tab', '');
  el.appendChild(plus);

  const a = state.tabs.find(t => t.id === state.activeId);
  if (document.activeElement !== $('addr')) $('addr').value = a ? a.addr : '';
  $('back').disabled = !state.canBack;
  $('fwd').disabled = !state.canForward;
  $('edit').disabled = !(a && a.file && a.kind !== 'editor');
}

shellApi.onTabs(s => { state = s; render(); });
shellApi.onFocusAddress(() => { $('addr').focus(); $('addr').select(); });
$('addr').addEventListener('keydown', e => {
  if (e.key === 'Enter') { shellApi.send('go', $('addr').value); $('addr').blur(); }
  if (e.key === 'Escape') { $('addr').blur(); render(); }
});
$('back').onclick = () => shellApi.send('nav', 'back');
$('fwd').onclick = () => shellApi.send('nav', 'forward');
$('reload').onclick = () => shellApi.send('nav', 'reload');
$('open').onclick = () => shellApi.send('open-dialog');
$('edit').onclick = () => shellApi.send('edit-current');
render();
</script>
</body>
</html>
