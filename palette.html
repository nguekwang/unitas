<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search</title>
<style>
  :root { --box:#252526; --fg:#d4d4d4; --dim:#8a8a8a; --sel:#04395e; --line:#333; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:transparent; color:var(--fg); overflow:hidden;
    font: 14px -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; user-select:none; }
  #backdrop { position:fixed; inset:0; background:rgba(0,0,0,.45); }
  #box { position:fixed; top:12vh; left:50%; transform:translateX(-50%); width:min(640px, calc(100vw - 32px));
    background:var(--box); border:1px solid #3a3a3a; border-radius:12px; box-shadow:0 18px 56px rgba(0,0,0,.55); overflow:hidden; }
  #q { width:100%; height:52px; padding:0 18px; border:0; border-bottom:1px solid var(--line); background:none;
    color:var(--fg); font-size:16px; outline:none; user-select:text; }
  #q::placeholder { color:#6b6b6b; }
  #list { max-height:min(440px, 62vh); overflow-y:auto; padding:4px 0 8px; }
  .sec { padding:10px 18px 4px; font-size:11px; color:var(--dim); }
  .it { display:flex; align-items:center; gap:10px; height:36px; padding:0 18px; margin:0 6px; border-radius:6px; cursor:default; }
  .it.sel { background:var(--sel); }
  .ic { width:20px; text-align:center; flex:none; }
  .t { flex:0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { flex:1; min-width:0; color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .key { flex:none; color:var(--dim); font-size:11px; }
  .empty { padding:16px 18px; color:var(--dim); }
  #foot { display:flex; gap:16px; padding:8px 18px; border-top:1px solid var(--line); color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="box">
  <input id="q" placeholder="Search tabs and commands, or type a URL, search terms, or a file path" spellcheck="false" autocomplete="off">
  <div id="list"></div>
  <div id="foot"><span>↑↓ Select</span><span>Enter Run</span><span>Esc Close</span><span>:w save · :q close tab · :e open file</span></div>
</div>
<script>
const $ = id => document.getElementById(id);
const ICON = { web:'🌐', pdf:'📕', html:'🧩', image:'🖼', editor:'📝', start:'✦' };
let st = { tabs: [], activeId: null };
let items = [];
let sel = 0;
let seq = 0;

function commands(s) {
  return [
    // key: the NORMAL-mode key (or :command) shown on the right; alias: exact :commands, as in vim
    { cmd:'new-tab', ic:'+', t:'New tab', key:'t', alias:['tabnew', 'new'] },
    { cmd:'open-file', ic:'📂', t:'Open file', key:':e', alias:['e', 'open'] },
    s.canSave && { cmd:'save', ic:'💾', t:'Save', key:':w', alias:['w', 'save'] },
    s.canPreview && { cmd:'preview', ic:'👁', t:'Toggle Markdown preview', key:':p', alias:['p', 'preview'] },
    s.editable && { cmd:'edit', ic:'📝', t:'Edit this file', key:'e', alias:['edit'] },
    s.canReload && { cmd:'reload', ic:'⟳', t:'Reload', key:'r', alias:['r', 'reload'] },
    s.canBack && { cmd:'back', ic:'←', t:'Back', key:'H', alias:['back'] },
    s.canForward && { cmd:'forward', ic:'→', t:'Forward', key:'L', alias:['forward', 'fwd'] },
    { cmd:'close-tab', ic:'×', t:'Close this tab', key:'x', alias:['q', 'close'] }
  ].filter(Boolean);
}

// Substring match ranks first (by position); otherwise a subsequence match ranked by gaps. -1 = no match.
function score(q, text) {
  text = text.toLowerCase();
  const at = text.indexOf(q);
  if (at >= 0) return at;
  let i = 0, last = -1, gaps = 0;
  for (const ch of q) {
    const j = text.indexOf(ch, i);
    if (j < 0) return -1;
    if (last >= 0) gaps += j - last - 1;
    last = j; i = j + 1;
  }
  return 1000 + gaps;
}
function rank(q, arr, key) {
  if (!q) return arr;
  return arr.map(x => [score(q, key(x)), x]).filter(p => p[0] >= 0).sort((a, b) => a[0] - b[0]).map(p => p[1]);
}

async function build() {
  const raw = $('q').value.replace(/^\s*:/, ''); // ":w" and "w" mean the same thing
  const q = raw.trim().toLowerCase();
  const my = ++seq;
  const out = [];
  const cmds = commands(st);
  const exact = q ? cmds.filter(c => c.alias.includes(q)) : [];
  for (const c of exact)
    out.push({ sec:'Run', ic: c.ic, t: c.t, key: c.key, run: { type:'cmd', name: c.cmd } });
  if (q) {
    const c = await paletteApi.classify(raw);
    if (my !== seq) return; // a newer keystroke superseded this one
    const web = c.kind === 'web';
    out.push({ sec:'Go to', ic: web ? (c.search ? '🔍' : '🌐') : (ICON[c.kind] || '📄'),
      t: web ? (c.search ? 'Search Google' : 'Open page') : 'Open file', sub: raw.trim(), run: { type:'go', input: raw } });
  }
  for (const t of rank(q, st.tabs, t => t.title + ' ' + t.addr))
    out.push({ sec:'Tabs', ic: ICON[t.kind] || '·', t: t.title, sub: t.id === st.activeId ? 'Current tab' : t.addr, run: { type:'tab', id: t.id } });
  for (const c of rank(q, cmds.filter(c => !exact.includes(c)), c => c.t + ' ' + c.cmd))
    out.push({ sec:'Commands', ic: c.ic, t: c.t, key: c.key, run: { type:'cmd', name: c.cmd } });
  items = out;
  sel = 0;
  render();
}

function render() {
  const list = $('list');
  list.innerHTML = '';
  if (!items.length) {
    const e = document.createElement('div');
    e.className = 'empty'; e.textContent = 'No matches';
    list.appendChild(e);
    return;
  }
  let sec = null;
  items.forEach((it, i) => {
    if (it.sec !== sec) {
      sec = it.sec;
      const h = document.createElement('div');
      h.className = 'sec'; h.textContent = sec;
      list.appendChild(h);
    }
    const d = document.createElement('div');
    d.className = 'it' + (i === sel ? ' sel' : '');
    for (const [cls, text] of [['ic', it.ic], ['t', it.t], ['sub', it.sub || ''], ['key', it.key || '']]) {
      const s = document.createElement('span');
      s.className = cls; s.textContent = text;
      d.appendChild(s);
    }
    d.addEventListener('mousemove', () => { if (sel !== i) { sel = i; mark(); } });
    d.addEventListener('mousedown', e => { e.preventDefault(); paletteApi.run(it.run); });
    list.appendChild(d);
  });
}

function mark() {
  const rows = $('list').querySelectorAll('.it');
  rows.forEach((r, i) => r.classList.toggle('sel', i === sel));
  if (rows[sel]) rows[sel].scrollIntoView({ block: 'nearest' });
}

$('q').addEventListener('input', build);
$('q').addEventListener('keydown', e => {
  if (e.isComposing) return; // IME conversion in progress (e.g. Japanese input)
  if (e.key === 'ArrowDown') { e.preventDefault(); if (items.length) { sel = (sel + 1) % items.length; mark(); } }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (items.length) { sel = (sel - 1 + items.length) % items.length; mark(); } }
  else if (e.key === 'Enter') { e.preventDefault(); if (items[sel]) paletteApi.run(items[sel].run); }
  else if (e.key === 'Escape') { e.preventDefault(); paletteApi.close(); }
});
$('backdrop').addEventListener('mousedown', () => paletteApi.close());

paletteApi.onOpen(s => {
  st = s;
  $('q').value = s.prefill || '';
  build();
  $('q').focus();
  if (s.prefill === ':') $('q').setSelectionRange(1, 1); // keep the ":" and type the command after it
  else $('q').select();
});
</script>
</body>
</html>
