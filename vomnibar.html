<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vomnibar</title>
<!-- The vomnibar (cf. Vimium C front/vomnibar.html): o / O / T / ge / : open it.
     Suggestions come from the main process (background/completion.js). -->
<style>
  :root { --box:#252526; --fg:#d4d4d4; --dim:#8a8a8a; --sel:#04395e; --line:#333; --accent:#3b82f6; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:transparent; color:var(--fg); overflow:hidden;
    font: 14px -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; user-select:none; }
  #backdrop { position:fixed; inset:0; background:rgba(0,0,0,.45); }
  #box { position:fixed; top:12vh; left:50%; transform:translateX(-50%); width:min(720px, calc(100vw - 32px));
    background:var(--box); border:1px solid #3a3a3a; border-radius:12px; box-shadow:0 18px 56px rgba(0,0,0,.55); overflow:hidden; }
  #bar { display:flex; align-items:center; border-bottom:1px solid var(--line); }
  #tag { flex:none; margin-left:14px; padding:2px 8px; border-radius:4px; background:var(--accent); color:#fff;
    font:600 11px ui-monospace, "JetBrains Mono", monospace; }
  #tag:empty { display:none; }
  #q { flex:1; min-width:0; height:52px; padding:0 16px; border:0; background:none; color:var(--fg); font-size:16px; outline:none; user-select:text; }
  #q::placeholder { color:#6b6b6b; }
  #list { max-height:min(460px, 62vh); overflow-y:auto; padding:4px 0 8px; }
  .sec { padding:10px 18px 4px; font-size:11px; color:var(--dim); }
  .it { display:flex; align-items:center; gap:10px; height:36px; padding:0 12px; margin:0 6px; border-radius:6px; cursor:default; }
  .it.sel { background:var(--sel); }
  .ic { width:20px; text-align:center; flex:none; }
  .t { flex:0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { flex:1; min-width:0; color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .key { flex:none; color:#ffd866; font:11px ui-monospace, "JetBrains Mono", monospace; }
  .empty { padding:16px 18px; color:var(--dim); }
  #foot { display:flex; gap:16px; padding:8px 18px; border-top:1px solid var(--line); color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="box">
  <div id="bar"><span id="tag"></span><input id="q" spellcheck="false" autocomplete="off"></div>
  <div id="list"></div>
  <div id="foot"><span>↑↓ / Tab select</span><span>Enter open</span><span>Shift+Enter new tab</span><span>Esc close</span><span>"w tokyo": search engine "w"</span></div>
</div>
<script>
const $ = id => document.getElementById(id);
const PLACEHOLDER = {
  omni: 'Search tabs and history, or type a URL, search terms, or a file path',
  tabs: 'Search open tabs',
  command: 'Command: w save · q close tab · e open file · settings · help'
};
let opts = { mode: 'omni', newTab: false };
let items = [];
let sel = 0;
let seq = 0;

async function build() {
  const my = ++seq;
  const res = await vomnibarApi.query($('q').value, opts.mode);
  if (my !== seq) return; // a newer keystroke superseded this one
  items = res || [];
  sel = 0;
  render();
}

function render() {
  const list = $('list');
  list.innerHTML = '';
  if (!items.length) {
    const e = document.createElement('div');
    e.className = 'empty'; e.textContent = 'No matches';
    list.appendChild(e);
    return;
  }
  let sec = null;
  items.forEach((it, i) => {
    if (it.sec !== sec) {
      sec = it.sec;
      const h = document.createElement('div');
      h.className = 'sec'; h.textContent = sec;
      list.appendChild(h);
    }
    const d = document.createElement('div');
    d.className = 'it' + (i === sel ? ' sel' : '');
    for (const [cls, text] of [['ic', it.icon], ['t', it.title], ['sub', it.sub || ''], ['key', it.key || '']]) {
      const s = document.createElement('span');
      s.className = cls; s.textContent = text;
      d.appendChild(s);
    }
    d.addEventListener('mousemove', () => { if (sel !== i) { sel = i; mark(); } });
    d.addEventListener('mousedown', e => { e.preventDefault(); go(it, e.shiftKey); });
    list.appendChild(d);
  });
}

function mark() {
  const rows = $('list').querySelectorAll('.it');
  rows.forEach((r, i) => r.classList.toggle('sel', i === sel));
  if (rows[sel]) rows[sel].scrollIntoView({ block: 'nearest' });
}
const move = d => { if (items.length) { sel = (sel + d + items.length) % items.length; mark(); } };
const go = (it, shift) => vomnibarApi.run(it.run, opts.newTab || shift);

$('q').addEventListener('input', build);
$('q').addEventListener('keydown', e => {
  if (e.isComposing) return; // IME conversion in progress (e.g. Japanese input)
  if (e.key === 'ArrowDown' || (e.key === 'Tab' && !e.shiftKey)) { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey)) { e.preventDefault(); move(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (items[sel]) go(items[sel], e.shiftKey); }
  else if (e.key === 'Escape') { e.preventDefault(); vomnibarApi.close(); }
});
$('backdrop').addEventListener('mousedown', () => vomnibarApi.close());

vomnibarApi.onOpen(o => {
  opts = o;
  $('tag').textContent = o.mode === 'tabs' ? 'TABS' : o.mode === 'command' ? 'CMD' : (o.newTab ? 'NEW TAB' : '');
  $('q').placeholder = PLACEHOLDER[o.mode] || PLACEHOLDER.omni;
  $('q').value = o.prefill || '';
  build();
  $('q').focus();
  if (o.prefill === ':') $('q').setSelectionRange(1, 1); // keep the ":" and type the command after it
  else $('q').select();
});
</script>
</body>
</html>
