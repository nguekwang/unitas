<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  html, body { height:100%; margin:0; background:#1e1e1e; color:#d4d4d4;
    font: 15px/1.7 -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width:560px; margin:14vh auto 0; padding:0 24px; }
  h1 { font-size:28px; font-weight:600; margin:0 0 4px; }
  p { color:#8a8a8a; margin:0 0 28px; }
  table { border-collapse:collapse; }
  td { padding:3px 18px 3px 0; }
  kbd { background:#333; border-radius:4px; padding:1px 7px; font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>Unitas</h1>
  <p>ブラウザ・エディタ・PDF / MD / HTML ビューアを1つのタブ付きウィンドウで。</p>
  <table>
    <tr><td><kbd>Ctrl</kbd>+<kbd>L</kbd></td><td>アドレスバー（URL・検索語・ファイルパス）</td></tr>
    <tr><td><kbd>Ctrl</kbd>+<kbd>O</kbd></td><td>ファイルを開く（.pdf/.html は表示、.md などは編集）</td></tr>
    <tr><td><kbd>Ctrl</kbd>+<kbd>E</kbd></td><td>表示中のファイルを編集</td></tr>
    <tr><td><kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>保存（エディタ）</td></tr>
    <tr><td><kbd>Ctrl</kbd>+<kbd>P</kbd></td><td>MDプレビューの表示切替（エディタ）</td></tr>
    <tr><td><kbd>Ctrl</kbd>+<kbd>T</kbd> / <kbd>W</kbd></td><td>タブを開く / 閉じる</td></tr>
    <tr><td><kbd>Ctrl</kbd>+<kbd>Tab</kbd></td><td>タブ切替</td></tr>
  </table>
</main>
</body>
</html>
